name: lensing-l8-full-reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/probe_lensing_l8_full_parity.py'
      - 'references/lensing_l8_full_legacy_reference.json'
      - '.github/workflows/lensing-l8-full-reference.yml'

jobs:
  legacy-reference:
    runs-on: ubuntu-24.04
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      DARKSIRENS_ZMAX: '5.0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout rebuild control repo
        uses: actions/checkout@v4
        with:
          path: rebuild

      - name: Checkout pinned legacy oracle
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pinned legacy SHA
        run: |
          test "$(git -C legacy rev-parse HEAD)" = "c042527238bd71421b792936bc48c3b815b90d6d"

      - name: Install pinned full-lensing numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' \
            'scipy==1.12.0' \
            'h5py==3.12.1' \
            'jax==0.4.34' \
            'jaxlib==0.4.34' \
            'astropy==6.1.4' \
            'tqdm==4.66.5'

      - name: Run pinned legacy full-stack probe twice
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy
        run: |
          python rebuild/tools/probe_lensing_l8_full_parity.py \
            --output rebuild/lensing_l8.generated1.json
          python rebuild/tools/probe_lensing_l8_full_parity.py \
            --output rebuild/lensing_l8.generated2.json

      - name: Assert repeated-process parity and L8 structure
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          def close(a, b, path='root'):
              if isinstance(a, bool) or isinstance(b, bool):
                  assert a is b, (path, a, b); return
              if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert math.isclose(float(a), float(b), rel_tol=5e-10, abs_tol=5e-10), (path, a, b)
                  return
              assert type(a) is type(b), (path, type(a), type(b))
              if isinstance(a, dict):
                  assert a.keys() == b.keys(), path
                  for k in a: close(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): close(x, y, f'{path}[{i}]')
              else:
                  assert a == b, (path, a, b)

          one = json.loads(Path('rebuild/lensing_l8.generated1.json').read_text())
          two = json.loads(Path('rebuild/lensing_l8.generated2.json').read_text())
          close(one, two)
          assert one['schema'] == 'darksirens-lensing-l8-full-parity-1'
          assert one['legacy_sha'] == 'c042527238bd71421b792936bc48c3b815b90d6d'
          assert len(one['partitions']) == 6
          assert len(one['once_terms']['per_event_logL']) == 8
          assert len(one['once_terms']['per_pair_logL']) == 3
          assert all(math.isfinite(x) for x in one['once_terms']['per_event_logL'])
          assert all(math.isfinite(x) for x in one['once_terms']['per_pair_logL'])
          assert math.isfinite(one['log_partition_prior_normalizer'])
          assert math.isfinite(one['marginalized_logL'])
          for p in one['partitions']:
              assert p['n_singletons'] + 2*p['n_pairs'] == 8
              assert p['n_sources'] == p['n_singletons'] + p['n_pairs']
              assert math.isfinite(p['logL_total'])
              assert math.isfinite(p['selection_correction_total'])
          print('Lensing L8 full legacy structure PASS')
          PY

      - name: Compare committed golden when present
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          def close(a, b, path='root'):
              if isinstance(a, bool) or isinstance(b, bool):
                  assert a is b, (path, a, b); return
              if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert math.isclose(float(a), float(b), rel_tol=5e-9, abs_tol=5e-10), (path, a, b)
                  return
              assert type(a) is type(b), (path, type(a), type(b))
              if isinstance(a, dict):
                  assert a.keys() == b.keys(), path
                  for k in a: close(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): close(x, y, f'{path}[{i}]')
              else:
                  assert a == b, (path, a, b)

          generated = json.loads(Path('rebuild/lensing_l8.generated1.json').read_text())
          golden = Path('rebuild/references/lensing_l8_full_legacy_reference.json')
          if golden.exists():
              close(generated, json.loads(golden.read_text()))
              print('Lensing L8 committed full-stack golden PASS')
          else:
              print('Lensing L8 bootstrap run: committed golden not present yet')
          PY

      - name: Upload regenerated reference
        uses: actions/upload-artifact@v4
        with:
          name: lensing-l8-full-legacy-reference
          path: rebuild/lensing_l8.generated1.json
          if-no-files-found: error
