name: lensing-l0c-reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/probe_lensing_pair_kde_cluster.py'
      - 'references/lensing_l0c_pair_legacy_reference.json'
      - '.github/workflows/lensing-l0c-reference.yml'

jobs:
  legacy-reference:
    runs-on: ubuntu-24.04
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      DARKSIRENS_ZMAX: '5.0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout rebuild control repo
        uses: actions/checkout@v4
        with:
          path: rebuild

      - name: Checkout pinned legacy oracle
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pinned legacy SHA
        run: |
          test "$(git -C legacy rev-parse HEAD)" = "c042527238bd71421b792936bc48c3b815b90d6d"

      - name: Install pinned pair-likelihood numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' \
            'scipy==1.12.0' \
            'h5py==3.12.1' \
            'jax==0.4.34' \
            'jaxlib==0.4.34' \
            'astropy==6.1.4' \
            'tqdm==4.66.5'

      - name: Run pinned legacy L0C probe twice
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy
        run: |
          python rebuild/tools/probe_lensing_pair_kde_cluster.py \
            --output rebuild/lensing_l0c.generated1.json
          python rebuild/tools/probe_lensing_pair_kde_cluster.py \
            --output rebuild/lensing_l0c.generated2.json

      - name: Assert repeated-process parity and scientific pins
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          def close(a, b, path='root'):
              if isinstance(a, bool) or isinstance(b, bool):
                  assert a is b, (path, a, b); return
              if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert math.isclose(float(a), float(b), rel_tol=5e-10, abs_tol=5e-10), (path, a, b)
                  return
              assert type(a) is type(b), (path, type(a), type(b))
              if isinstance(a, dict):
                  assert a.keys() == b.keys(), path
                  for k in a: close(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): close(x, y, f'{path}[{i}]')
              else:
                  assert a == b, (path, a, b)

          one = json.loads(Path('rebuild/lensing_l0c.generated1.json').read_text())
          two = json.loads(Path('rebuild/lensing_l0c.generated2.json').read_text())
          close(one, two)
          assert one['schema'] == 'darksirens-lensing-l0c-pair-reference-1'
          assert one['legacy_sha'] == 'c042527238bd71421b792936bc48c3b815b90d6d'

          k = one['pair_kde']
          assert k['n_total'] == 300
          assert k['n_valid'] == 298
          assert k['has_offdiagonal_whitening'] is True
          assert k['malformed_prior_rejected'] is True
          assert k['padding_max_abs_delta'] < 2e-12
          assert k['q_reflection_pair_delta'] < 2e-10
          assert all(math.isfinite(x) for x in k['log_eval'])
          assert math.isfinite(k['log_norm'])

          p = one['cluster_pair']
          assert p['y_nodes'] == 32
          assert math.isfinite(p['pair_logL'])
          assert p['pair_mc_variance'] >= 0.0 and math.isfinite(p['pair_mc_variance'])
          assert p['swapped_pair_mc_variance'] >= 0.0 and math.isfinite(p['swapped_pair_mc_variance'])
          assert abs(p['pair_minus_manual_sum']) < 2e-10
          assert abs(p['pair_minus_manual_average'] - math.log(2.0)) < 2e-10
          assert p['swap_abs_delta'] < 2e-10
          assert p['swap_variance_abs_delta'] < 2e-10
          # Bandwidth scale is a sensitivity handle, not a second estimator.
          assert math.isfinite(p['bandwidth_half_logL'])
          assert abs(p['bandwidth_half_minus_default']) > 1e-6
          print('Lensing L0C repeated-process/scientific structure PASS')
          PY

      - name: Compare committed golden when present
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          def close(a, b, path='root'):
              if isinstance(a, bool) or isinstance(b, bool):
                  assert a is b, (path, a, b); return
              if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert math.isclose(float(a), float(b), rel_tol=5e-9, abs_tol=5e-10), (path, a, b)
                  return
              assert type(a) is type(b), (path, type(a), type(b))
              if isinstance(a, dict):
                  assert a.keys() == b.keys(), path
                  for k in a: close(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): close(x, y, f'{path}[{i}]')
              else:
                  assert a == b, (path, a, b)

          generated = json.loads(Path('rebuild/lensing_l0c.generated1.json').read_text())
          golden = Path('rebuild/references/lensing_l0c_pair_legacy_reference.json')
          if golden.exists():
              close(generated, json.loads(golden.read_text()))
              print('Lensing L0C committed golden numerical comparison PASS')
          else:
              print('Lensing L0C bootstrap run: committed golden not present yet')
          PY

      - name: Upload regenerated reference
        uses: actions/upload-artifact@v4
        with:
          name: lensing-l0c-pair-legacy-reference
          path: rebuild/lensing_l0c.generated1.json
          if-no-files-found: error
