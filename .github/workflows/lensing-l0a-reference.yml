name: lensing-l0a-reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/probe_lensing_wl.py'
      - 'references/lensing_l0a_wl_legacy_reference.json'
      - '.github/workflows/lensing-l0a-reference.yml'

jobs:
  legacy-reference:
    runs-on: ubuntu-24.04
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      DARKSIRENS_ZMAX: '5.0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout rebuild control repo
        uses: actions/checkout@v4
        with:
          path: rebuild

      - name: Checkout pinned legacy oracle
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pinned legacy SHA
        run: |
          test "$(git -C legacy rev-parse HEAD)" = "c042527238bd71421b792936bc48c3b815b90d6d"

      - name: Install pinned weak-lensing numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' \
            'scipy==1.12.0' \
            'h5py==3.12.1' \
            'jax==0.4.34' \
            'jaxlib==0.4.34' \
            'astropy==6.1.4' \
            'tqdm==4.66.5'

      - name: Run pinned legacy L0A probe twice
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy
        run: |
          python rebuild/tools/probe_lensing_wl.py \
            --output rebuild/lensing_l0a_wl.generated1.json
          python rebuild/tools/probe_lensing_wl.py \
            --output rebuild/lensing_l0a_wl.generated2.json

      - name: Assert repeated-process parity and scientific pins
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          def close(a, b, path='root'):
              if isinstance(a, bool) or isinstance(b, bool):
                  assert a is b, (path, a, b); return
              if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert math.isclose(float(a), float(b), rel_tol=5e-11, abs_tol=5e-11), (path, a, b)
                  return
              assert type(a) is type(b), (path, type(a), type(b))
              if isinstance(a, dict):
                  assert a.keys() == b.keys(), path
                  for k in a: close(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): close(x, y, f'{path}[{i}]')
              else:
                  assert a == b, (path, a, b)

          one = json.loads(Path('rebuild/lensing_l0a_wl.generated1.json').read_text())
          two = json.loads(Path('rebuild/lensing_l0a_wl.generated2.json').read_text())
          close(one, two)
          assert one['schema'] == 'darksirens-lensing-l0a-wl-reference-1'
          assert one['legacy_sha'] == 'c042527238bd71421b792936bc48c3b815b90d6d'
          assert one['pdf']['max_abs_norm_minus_one'] < 2e-3
          assert one['pdf']['max_abs_mean_minus_one'] < 2e-3
          assert one['tabulated']['max_abs_interp_error'] < 2e-12
          assert one['tabulated']['minus_inf_allowed'] is True
          assert one['tabulated']['nan_rejected'] is True
          assert one['tabulated']['duplicate_grid_rejected'] is True
          q = one['quadrature']
          assert q['production_mu_nodes'] == 16
          assert q['production_log_mu_range'] == [-0.6, 0.6]
          assert abs(q['hermite_weight_sum'] - 1.0) < 2e-14
          assert abs(q['y_weighted_p_integral'] - 1.0) < 2e-14
          assert max(q['hermite_abs_logI_error']) < 1e-3
          assert max(q['a0_abs_logI_error']) == 0.0
          e = one['event_weight']
          assert e['dispatcher_off_bit_identical'] is True
          assert e['hermite_a0_max_abs_delta'] < 2e-11
          assert e['all_default_finite'] is True
          assert e['grad_at_zero_finite'] is True
          print('Lensing L0A repeated-process/scientific structure PASS')
          PY

      - name: Compare committed golden when present
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          def close(a, b, path='root'):
              if isinstance(a, bool) or isinstance(b, bool):
                  assert a is b, (path, a, b); return
              if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert math.isclose(float(a), float(b), rel_tol=5e-10, abs_tol=5e-10), (path, a, b)
                  return
              assert type(a) is type(b), (path, type(a), type(b))
              if isinstance(a, dict):
                  assert a.keys() == b.keys(), path
                  for k in a: close(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): close(x, y, f'{path}[{i}]')
              else:
                  assert a == b, (path, a, b)

          generated = json.loads(Path('rebuild/lensing_l0a_wl.generated1.json').read_text())
          golden = Path('rebuild/references/lensing_l0a_wl_legacy_reference.json')
          if golden.exists():
              close(generated, json.loads(golden.read_text()))
              print('Lensing L0A committed golden numerical comparison PASS')
          else:
              print('Lensing L0A bootstrap run: committed golden not present yet')
          PY

      - name: Upload regenerated reference
        uses: actions/upload-artifact@v4
        with:
          name: lensing-l0a-wl-legacy-reference
          path: rebuild/lensing_l0a_wl.generated1.json
          if-no-files-found: error
