name: surveys-s0b-selection-reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/probe_surveys_selection_fit.py'
      - 'references/surveys_s0b_selection_fit_reference.json'
      - '.github/workflows/surveys-s0b-selection-reference.yml'

jobs:
  legacy-selection-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild control repo
        uses: actions/checkout@v4
        with:
          path: rebuild

      - name: Checkout pinned legacy oracle
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pinned legacy SHA
        run: |
          test "$(git -C legacy rev-parse HEAD)" = "c042527238bd71421b792936bc48c3b815b90d6d"

      - name: Install validated selection-fit numerics
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.26.4 \
            scipy==1.12.0 \
            jax==0.4.34 \
            jaxlib==0.4.34 \
            astropy==6.1.4 \
            h5py==3.12.1 \
            healpy==1.17.3

      - name: Run pinned legacy S0b probe twice
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy
          JAX_ENABLE_X64: 'true'
          JAX_PLATFORMS: cpu
        run: |
          python rebuild/tools/probe_surveys_selection_fit.py \
            --output rebuild/surveys_s0b_selection_fit_reference.generated1.json
          python rebuild/tools/probe_surveys_selection_fit.py \
            --output rebuild/surveys_s0b_selection_fit_reference.generated2.json

      - name: Reference sanity and repeated-process determinism
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          one = json.loads(Path('rebuild/surveys_s0b_selection_fit_reference.generated1.json').read_text())
          two = json.loads(Path('rebuild/surveys_s0b_selection_fit_reference.generated2.json').read_text())
          assert one == two, 'canonical selection-fit reference differs across repeated processes'
          assert one['schema'] == 'darksirens-surveys-s0b-selection-fit-reference-1'
          assert one['legacy_sha'] == 'c042527238bd71421b792936bc48c3b815b90d6d'
          assert one['numerics']['numpy'] == '1.26.4'
          assert one['numerics']['scipy'] == '1.12.0'
          assert one['numerics']['jax'] == '0.4.34'
          assert one['numerics']['astropy'] == '6.1.4'
          assert one['gaussian']['family'] == 'gaussian'
          assert one['schechter']['family'] == 'schechter'
          assert one['gaussian']['json_key_order'][:4] == ['family', 'm_lim', 'M0hat', 'sigma_M']
          assert one['schechter']['json_key_order'][:5] == ['family', 'm_lim', 'Mstar_hat', 'alpha', 'M_faint_offset']
          assert one['firewall']['max_abs_delta_gaussian'] <= 1e-12
          assert one['firewall']['max_abs_delta_gaussian_kcorr'] <= 1e-12
          assert one['diagnostics']['kcorr_M0hat_shift_if_ignored'] > 0
          print('S0b repeated-process reference PASS')
          PY

      - name: Compare committed golden when present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          golden_path = Path('rebuild/references/surveys_s0b_selection_fit_reference.json')
          if not golden_path.exists():
              print('no committed S0b golden yet; candidate generation mode')
              raise SystemExit(0)
          got = json.loads(Path('rebuild/surveys_s0b_selection_fit_reference.generated1.json').read_text())
          golden = json.loads(golden_path.read_text())
          assert got == golden, 'S0b pinned-legacy probe differs from committed golden'
          print('S0b exact golden comparison PASS')
          PY

      - name: Upload regenerated reference
        uses: actions/upload-artifact@v4
        with:
          name: surveys-s0b-selection-fit-reference
          path: rebuild/surveys_s0b_selection_fit_reference.generated1.json
          if-no-files-found: error
