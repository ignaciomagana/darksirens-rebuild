name: lss-l7-field-global-reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/probe_lss_field_global.py'
      - 'references/lss_l7_field_global_legacy_reference.json'
      - '.github/workflows/lss-l7-field-global-reference.yml'

jobs:
  legacy-reference:
    runs-on: ubuntu-24.04
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      DARKSIRENS_ZMAX: '5.0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout rebuild control repo
        uses: actions/checkout@v4
        with:
          path: rebuild

      - name: Checkout pinned legacy oracle
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pinned legacy SHA
        run: test "$(git -C legacy rev-parse HEAD)" = "c042527238bd71421b792936bc48c3b815b90d6d"

      - name: Install pinned field-global numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' \
            'scipy==1.12.0' \
            'h5py==3.12.1' \
            'jax==0.4.34' \
            'jaxlib==0.4.34' \
            'astropy>=6,<8' \
            'healpy==1.19.0'

      - name: Run pinned legacy L7 probe twice
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy
        run: |
          python rebuild/tools/probe_lss_field_global.py --output rebuild/lss_l7_field_global.generated1.json
          python rebuild/tools/probe_lss_field_global.py --output rebuild/lss_l7_field_global.generated2.json

      - name: Compare repeated processes and physics invariants
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          a = json.loads(Path('rebuild/lss_l7_field_global.generated1.json').read_text())
          b = json.loads(Path('rebuild/lss_l7_field_global.generated2.json').read_text())

          def compare(x, y, path='root'):
              if isinstance(x, dict):
                  assert isinstance(y, dict) and set(x) == set(y), path
                  for k in x:
                      if k.endswith('_hash'):
                          continue
                      compare(x[k], y[k], path + '.' + k)
              elif isinstance(x, list):
                  assert isinstance(y, list) and len(x) == len(y), path
                  for i, (u, v) in enumerate(zip(x, y)):
                      compare(u, v, f'{path}[{i}]')
              elif isinstance(x, bool) or x is None or isinstance(x, str):
                  assert x == y, (path, x, y)
              elif isinstance(x, (int, float)):
                  if isinstance(x, int) and isinstance(y, int):
                      assert x == y, (path, x, y)
                  else:
                      assert math.isclose(float(x), float(y), rel_tol=5e-10, abs_tol=5e-11), (path, x, y)
              else:
                  assert x == y, (path, x, y)

          compare(a, b)
          assert a['schema'] == 'darksirens-lss-l7-field-global-reference-1'
          assert a['legacy_sha'] == 'c042527238bd71421b792936bc48c3b815b90d6d'
          for key in ('tracer_A', 'tracer_B'):
              t = a[key]
              assert t['member_logZ_spread'] < 2e-10, (key, t['member_logZ_spread'])
              assert max(t['missing_curve_max_abs_vs_unity']) < 5e-9, key
              assert max(t['gauge_max_abs']) < 5e-12, key
          c = a['composition']
          assert abs(c['K1_shift_delta']) < 5e-11, c['K1_shift_delta']
          assert abs(c['K2_common_shift_delta']) < 5e-11, c['K2_common_shift_delta']
          assert abs(c['K2_relative_shift_delta']) > 1e-5, c['K2_relative_shift_delta']
          assert c['mixture_manual_max_abs'] < 5e-12, c['mixture_manual_max_abs']
          s = a['shared_member_axis']
          assert s['matched_correlation'] > 0.99, s
          assert s['reversed_correlation'] < -0.9, s
          assert abs(c['logZ_difference_B_minus_A']) > 1e-4, c
          print('L7 repeated-process and field-global physics invariants PASS')
          PY

      - name: Compare committed golden when present
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          generated = json.loads(Path('rebuild/lss_l7_field_global.generated1.json').read_text())
          gp = Path('rebuild/references/lss_l7_field_global_legacy_reference.json')
          if not gp.exists():
              print('L7 bootstrap run: committed golden not present yet')
              raise SystemExit(0)
          golden = json.loads(gp.read_text())

          def compare(x, y, path='root'):
              if isinstance(x, dict):
                  assert isinstance(y, dict) and set(x) == set(y), path
                  for k in x:
                      if k.endswith('_hash'):
                          continue
                      compare(x[k], y[k], path + '.' + k)
              elif isinstance(x, list):
                  assert isinstance(y, list) and len(x) == len(y), path
                  for i, (u, v) in enumerate(zip(x, y)):
                      compare(u, v, f'{path}[{i}]')
              elif isinstance(x, bool) or x is None or isinstance(x, str):
                  assert x == y, (path, x, y)
              elif isinstance(x, (int, float)):
                  if isinstance(x, int) and isinstance(y, int):
                      assert x == y, (path, x, y)
                  else:
                      assert math.isclose(float(x), float(y), rel_tol=6e-10, abs_tol=6e-11), (path, x, y)
              else:
                  assert x == y, (path, x, y)

          compare(generated, golden)
          print('L7 committed golden numerical/structural parity PASS')
          PY

      - name: Upload regenerated reference
        uses: actions/upload-artifact@v4
        with:
          name: lss-l7-field-global-legacy-reference
          path: rebuild/lss_l7_field_global.generated1.json
          if-no-files-found: error
