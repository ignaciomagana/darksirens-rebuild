name: surveys-s0a-reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/probe_surveys_build.py'
      - 'references/surveys_s0a_legacy_reference.json'
      - '.github/workflows/surveys-s0a-reference.yml'

jobs:
  legacy-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild control repo
        uses: actions/checkout@v4
        with:
          path: rebuild

      - name: Checkout pinned legacy oracle
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pinned legacy SHA
        run: |
          test "$(git -C legacy rev-parse HEAD)" = "c042527238bd71421b792936bc48c3b815b90d6d"

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy<2' h5py healpy matplotlib tqdm

      - name: Run pinned legacy S0a probe
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy
          MPLBACKEND: Agg
        run: |
          python rebuild/tools/probe_surveys_build.py \
            --output rebuild/surveys_s0a_legacy_reference.generated.json

      - name: Basic reference assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('rebuild/surveys_s0a_legacy_reference.generated.json')
          d = json.loads(p.read_text())
          assert d['schema'] == 'darksirens-surveys-s0a-reference-1'
          assert d['legacy_sha'] == 'c042527238bd71421b792936bc48c3b815b90d6d'
          assert d['pixelate']['attrs'] == {'nside': 2, 'z_depth': 0.25}
          assert sum(d['pixelate']['ngals']) == 8
          assert d['pixelate']['padding'] == {
              'z_all_100_after_ngals': True,
              'dz_all_1_after_ngals': True,
              'w_all_0_after_ngals': True,
          }
          assert len(d['depth']['degraded_nside1']['f_p']) == 12
          print('S0a legacy reference structure PASS')
          PY

      - name: Compare exactly with committed golden
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          got = json.loads(Path('rebuild/surveys_s0a_legacy_reference.generated.json').read_text())
          golden = json.loads(Path('rebuild/references/surveys_s0a_legacy_reference.json').read_text())
          if got != golden:
              import pprint
              print('generated legacy reference differs from committed golden')
              print('generated:')
              pprint.pp(got)
              print('golden:')
              pprint.pp(golden)
              raise SystemExit(1)
          print('S0a exact golden comparison PASS')
          PY

      - name: Upload regenerated reference
        uses: actions/upload-artifact@v4
        with:
          name: surveys-s0a-legacy-reference
          path: rebuild/surveys_s0a_legacy_reference.generated.json
          if-no-files-found: error
