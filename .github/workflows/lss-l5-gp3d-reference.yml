name: lss-l5-gp3d-reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/probe_lss_gp3d.py'
      - 'references/lss_l5_gp3d_legacy_reference.json'
      - '.github/workflows/lss-l5-gp3d-reference.yml'

jobs:
  legacy-reference:
    runs-on: ubuntu-24.04
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      DARKSIRENS_ZMAX: '5.0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout rebuild control repo
        uses: actions/checkout@v4
        with:
          path: rebuild

      - name: Checkout pinned legacy oracle
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pinned legacy SHA
        run: test "$(git -C legacy rev-parse HEAD)" = "c042527238bd71421b792936bc48c3b815b90d6d"

      - name: Install pinned GP3D numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' \
            'scipy==1.12.0' \
            'h5py==3.12.1' \
            'jax==0.4.34' \
            'jaxlib==0.4.34' \
            'astropy>=6,<8' \
            'healpy==1.19.0'

      - name: Run pinned legacy L5 probe twice
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy
        run: |
          python rebuild/tools/probe_lss_gp3d.py --output rebuild/lss_l5_gp3d.generated1.json
          python rebuild/tools/probe_lss_gp3d.py --output rebuild/lss_l5_gp3d.generated2.json

      - name: Compare repeated processes numerically and structurally
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          a = json.loads(Path('rebuild/lss_l5_gp3d.generated1.json').read_text())
          b = json.loads(Path('rebuild/lss_l5_gp3d.generated2.json').read_text())

          def compare(x, y, path='root'):
              if isinstance(x, dict):
                  assert isinstance(y, dict) and set(x) == set(y), path
                  for k in x:
                      compare(x[k], y[k], path + '.' + k)
              elif isinstance(x, list):
                  assert isinstance(y, list) and len(x) == len(y), path
                  for i, (u, v) in enumerate(zip(x, y)):
                      compare(u, v, f'{path}[{i}]')
              elif isinstance(x, bool) or x is None or isinstance(x, str):
                  assert x == y, (path, x, y)
              elif isinstance(x, (int, float)):
                  assert isinstance(y, (int, float)), path
                  if isinstance(x, int) and isinstance(y, int):
                      assert x == y, (path, x, y)
                  else:
                      assert math.isclose(float(x), float(y), rel_tol=2e-11, abs_tol=2e-12), (path, x, y)
              else:
                  assert x == y, (path, x, y)

          # Raw-byte hashes of computed float arrays can differ in final bits
          # across independent JAX processes. Compare all non-hash content.
          def drop_hashes(v):
              if isinstance(v, dict):
                  return {k: drop_hashes(x) for k, x in v.items() if not k.endswith('_hash')}
              if isinstance(v, list):
                  return [drop_hashes(x) for x in v]
              return v

          compare(drop_hashes(a), drop_hashes(b))
          assert a['schema'] == 'darksirens-lss-l5-gp3d-reference-1'
          assert a['legacy_sha'] == 'c042527238bd71421b792936bc48c3b815b90d6d'
          assert a['single']['solver_diagnostics']['converged'] is True
          assert a['joint']['solver_diagnostics']['converged'] is True
          assert a['single']['homogeneous_max_abs'] < 1e-8
          q = a['single']['borrow_at_structure']
          assert q[0] > q[1] > q[2]
          assert a['joint']['same_voxel_member_corr'] > 0.99
          assert a['joint']['same_member_count'] == 10
          print('L5 repeated-process numerical/structural parity PASS')
          PY

      - name: Compare committed golden when present
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          generated = json.loads(Path('rebuild/lss_l5_gp3d.generated1.json').read_text())
          gp = Path('rebuild/references/lss_l5_gp3d_legacy_reference.json')
          if not gp.exists():
              print('L5 bootstrap run: committed golden not present yet')
              raise SystemExit(0)
          golden = json.loads(gp.read_text())

          def compare(x, y, path='root'):
              if isinstance(x, dict):
                  assert isinstance(y, dict) and set(x) == set(y), path
                  for k in x:
                      if k.endswith('_hash'):
                          continue
                      compare(x[k], y[k], path + '.' + k)
              elif isinstance(x, list):
                  assert isinstance(y, list) and len(x) == len(y), path
                  for i, (u, v) in enumerate(zip(x, y)):
                      compare(u, v, f'{path}[{i}]')
              elif isinstance(x, bool) or x is None or isinstance(x, str):
                  assert x == y, (path, x, y)
              elif isinstance(x, (int, float)):
                  if isinstance(x, int) and isinstance(y, int):
                      assert x == y, (path, x, y)
                  else:
                      assert math.isclose(float(x), float(y), rel_tol=3e-10, abs_tol=3e-11), (path, x, y)
              else:
                  assert x == y, (path, x, y)
          compare(generated, golden)
          print('L5 committed golden numerical/structural parity PASS')
          PY

      - name: Upload regenerated reference
        uses: actions/upload-artifact@v4
        with:
          name: lss-l5-gp3d-legacy-reference
          path: rebuild/lss_l5_gp3d.generated1.json
          if-no-files-found: error
