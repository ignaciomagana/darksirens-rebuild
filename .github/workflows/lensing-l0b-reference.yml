name: lensing-l0b-reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/probe_lensing_sis_fcpdet.py'
      - 'references/lensing_l0b_legacy_reference.json'
      - '.github/workflows/lensing-l0b-reference.yml'

jobs:
  legacy-reference:
    runs-on: ubuntu-24.04
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      DARKSIRENS_ZMAX: '5.0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout rebuild control repo
        uses: actions/checkout@v4
        with:
          path: rebuild

      - name: Checkout pinned legacy oracle
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pinned legacy SHA
        run: |
          test "$(git -C legacy rev-parse HEAD)" = "c042527238bd71421b792936bc48c3b815b90d6d"

      - name: Install pinned lensing numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' \
            'scipy==1.12.0' \
            'h5py==3.12.1' \
            'jax==0.4.34' \
            'jaxlib==0.4.34' \
            'astropy==6.1.4' \
            'tqdm==4.66.5'

      - name: Run pinned legacy L0B probe twice
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy
        run: |
          python rebuild/tools/probe_lensing_sis_fcpdet.py \
            --output rebuild/lensing_l0b.generated1.json
          python rebuild/tools/probe_lensing_sis_fcpdet.py \
            --output rebuild/lensing_l0b.generated2.json

      - name: Assert repeated-process parity and scientific pins
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          def close(a, b, path='root'):
              if isinstance(a, bool) or isinstance(b, bool):
                  assert a is b, (path, a, b); return
              if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert math.isclose(float(a), float(b), rel_tol=5e-10, abs_tol=5e-10), (path, a, b)
                  return
              assert type(a) is type(b), (path, type(a), type(b))
              if isinstance(a, dict):
                  assert a.keys() == b.keys(), path
                  for k in a: close(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): close(x, y, f'{path}[{i}]')
              else:
                  assert a == b, (path, a, b)

          one = json.loads(Path('rebuild/lensing_l0b.generated1.json').read_text())
          two = json.loads(Path('rebuild/lensing_l0b.generated2.json').read_text())
          close(one, two)
          assert one['schema'] == 'darksirens-lensing-l0b-sis-fcpdet-reference-1'
          assert one['legacy_sha'] == 'c042527238bd71421b792936bc48c3b815b90d6d'

          s = one['sis']
          assert s['defaults']['T0_seconds'] == 5.36e6
          assert s['defaults']['DEFAULT_T0_SECONDS'] == 5.36e6
          assert s['defaults']['TAU_PROB_MAX'] < 1.0
          assert s['stress_clips_above_one'] is True
          assert s['stress_prob_strictly_below_one'] is True
          assert s['bad_y_all_neginf'] is True
          assert s['max_abs_inverse_error'] < 2e-15
          assert s['max_abs_mu_difference_minus_two'] < 2e-14

          f = one['finn_chernoff']
          assert f['defaults']['rho_thr'] == 8.0
          assert f['defaults']['r0'] == 750.0
          assert f['defaults']['mc_bar'] == 1.22
          assert f['defaults']['pair_orientation_modes'] == ['independent', 'shared_iota']
          assert f['single']['max_abs_threshold_error'] < 2e-13
          assert f['single']['pdet_tiny_distance'] == 1.0
          assert f['single']['pdet_huge_distance'] == 0.0
          assert f['single']['logmiss_tiny_is_neginf'] is True
          assert abs(f['theta_geometry']['optimal_theta'] - 4.0) < 2e-14

          p = f['pairs']
          assert p['independent_both_max_abs_identity'] < 2e-15
          assert p['independent_one_max_abs_identity'] < 2e-15
          assert p['shared_both_swap_max_abs'] < 2e-12
          assert p['shared_one_swap_max_abs'] < 2e-12
          assert p['independent_partner_miss_max_abs_identity'] < 2e-15
          assert p['independent_partner_miss_detected_distance_max_abs'] < 2e-15
          assert p['invalid_mode_rejected'] is True
          # The first three threshold pairs are the legacy documentation's
          # shared-inclination examples: shared iota boosts both-detected and
          # suppresses exactly-one relative to independently redrawn images.
          assert all(x > 1.0 for x in p['shared_over_independent_both'][:3])
          assert all(x < 1.0 for x in p['shared_over_independent_exactly_one'][:3])
          print('Lensing L0B repeated-process/scientific structure PASS')
          PY

      - name: Compare committed golden when present
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          def close(a, b, path='root'):
              if isinstance(a, bool) or isinstance(b, bool):
                  assert a is b, (path, a, b); return
              if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  assert math.isclose(float(a), float(b), rel_tol=5e-9, abs_tol=5e-10), (path, a, b)
                  return
              assert type(a) is type(b), (path, type(a), type(b))
              if isinstance(a, dict):
                  assert a.keys() == b.keys(), path
                  for k in a: close(a[k], b[k], f'{path}.{k}')
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): close(x, y, f'{path}[{i}]')
              else:
                  assert a == b, (path, a, b)

          generated = json.loads(Path('rebuild/lensing_l0b.generated1.json').read_text())
          golden = Path('rebuild/references/lensing_l0b_legacy_reference.json')
          if golden.exists():
              close(generated, json.loads(golden.read_text()))
              print('Lensing L0B committed golden numerical comparison PASS')
          else:
              print('Lensing L0B bootstrap run: committed golden not present yet')
          PY

      - name: Upload regenerated reference
        uses: actions/upload-artifact@v4
        with:
          name: lensing-l0b-sis-fcpdet-legacy-reference
          path: rebuild/lensing_l0b.generated1.json
          if-no-files-found: error
