name: lss-l0a-reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/probe_lss_q_artifact.py'
      - 'references/lss_l0a_legacy_reference.json'
      - '.github/workflows/lss-l0a-reference.yml'

jobs:
  legacy-reference:
    runs-on: ubuntu-24.04
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: 'true'
      DARKSIRENS_ZMAX: '5.0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout rebuild control repo
        uses: actions/checkout@v4
        with:
          path: rebuild

      - name: Checkout pinned legacy oracle
        uses: actions/checkout@v4
        with:
          repository: ignaciomagana/darksirens
          ref: c042527238bd71421b792936bc48c3b815b90d6d
          path: legacy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pinned legacy SHA
        run: |
          test "$(git -C legacy rev-parse HEAD)" = "c042527238bd71421b792936bc48c3b815b90d6d"

      - name: Install pinned L0A numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' \
            'scipy==1.12.0' \
            'h5py==3.12.1' \
            'jax==0.4.34' \
            'jaxlib==0.4.34'

      - name: Run pinned legacy L0A probe twice
        env:
          PYTHONPATH: ${{ github.workspace }}/legacy
        run: |
          python rebuild/tools/probe_lss_q_artifact.py \
            --output rebuild/lss_l0a_legacy_reference.generated1.json
          python rebuild/tools/probe_lss_q_artifact.py \
            --output rebuild/lss_l0a_legacy_reference.generated2.json

      - name: Assert deterministic reference structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          one = json.loads(Path('rebuild/lss_l0a_legacy_reference.generated1.json').read_text())
          two = json.loads(Path('rebuild/lss_l0a_legacy_reference.generated2.json').read_text())
          assert one == two, 'pinned legacy L0A probe is not deterministic across repeated processes'
          assert one['schema'] == 'darksirens-lss-l0a-reference-1'
          assert one['legacy_sha'] == 'c042527238bd71421b792936bc48c3b815b90d6d'
          assert one['spectrum']['shape'] == [64]
          assert one['budget_renormalization']['zero_budget_bins'] == [3]
          assert one['budget_renormalization']['zero_budget_map_column_unchanged'] is True
          assert one['budget_renormalization']['zero_budget_member_column_unchanged'] is True
          assert one['laplace_members']['same_seed_bit_identical'] is True
          h = one['hdf5_contract']
          assert h['indexing'] == 'global'
          assert h['budget_renormalized'] is True
          assert h['c_mode'] == 'aggregate'
          assert h['f_p_aware'] is True
          assert h['q_support_depth'] == 0.55
          assert h['n_members'] == 4
          assert h['member_content_sha256'] == h['expected_member_content_sha256']
          assert one['fail_closed']['poisoned_file_absent'] is True
          assert one['fail_closed']['unauditable_file_absent'] is True
          print('L0A repeated-process deterministic structure PASS')
          PY

      - name: Compare committed golden when present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          generated = json.loads(Path('rebuild/lss_l0a_legacy_reference.generated1.json').read_text())
          golden_path = Path('rebuild/references/lss_l0a_legacy_reference.json')
          if golden_path.exists():
              golden = json.loads(golden_path.read_text())
              assert generated == golden, 'pinned legacy L0A probe differs from committed golden'
              print('L0A exact committed golden comparison PASS')
          else:
              print('L0A bootstrap run: committed golden not present yet')
          PY

      - name: Upload regenerated reference
        uses: actions/upload-artifact@v4
        with:
          name: lss-l0a-legacy-reference
          path: rebuild/lss_l0a_legacy_reference.generated1.json
          if-no-files-found: error
